# ==========================================================
# Machine Learning Experiment Configuration
# Precipitation Downscaling - Khulna District
# ==========================================================

experiment:
  name: "khulna_precipitation_downscaling"
  description: >
    Comparison of machine-learning regression models for monthly
    precipitation downscaling over Khulna District.
  random_seed: 42

data:
  training_file: "data/processed/model_tables/khulna_precipitation_training_data.csv"
  target_column: "rainfall_mm"
  predictors:
    - "DEM"
    - "Slope"
    - "Aspect"
    - "NDVI"
    - "LST_Day"
    - "Distance_Sea"
  drop_columns:
    - "station"
    - "date"
    - "year"
    - "month"
    - "latitude"
    - "longitude"
  remove_missing_values: true
  remove_infinite_values: true
  remove_duplicate_rows: true

split:
  method: "random"
  train_size: 0.70
  validation_size: 0.15
  test_size: 0.15
  shuffle: true
  random_seed: 42

cross_validation:
  enabled: true
  method: "KFold"
  folds: 5
  shuffle: true
  random_seed: 42
  primary_scoring: "neg_root_mean_squared_error"

preprocessing:
  imputation_strategy: "median"
  standardize_features: false

models:
  Linear_Regression:
    enabled: true
    class_name: "LinearRegression"
    parameters:
      fit_intercept: true

  Random_Forest:
    enabled: true
    class_name: "RandomForestRegressor"
    parameters:
      n_estimators: 300
      max_depth: null
      min_samples_split: 2
      min_samples_leaf: 1
      max_features: "sqrt"
      bootstrap: true
      n_jobs: -1
      random_state: 42

  Gradient_Boosting:
    enabled: true
    class_name: "GradientBoostingRegressor"
    parameters:
      n_estimators: 300
      learning_rate: 0.05
      max_depth: 3
      min_samples_split: 2
      min_samples_leaf: 1
      subsample: 0.8
      random_state: 42

  XGBoost:
    enabled: true
    class_name: "XGBRegressor"
    parameters:
      objective: "reg:squarederror"
      n_estimators: 300
      learning_rate: 0.05
      max_depth: 6
      min_child_weight: 1
      subsample: 0.8
      colsample_bytree: 0.8
      n_jobs: -1
      random_state: 42

evaluation:
  metrics:
    - "RMSE"
    - "MAE"
    - "R2"
    - "Bias"
  primary_metric: "RMSE"
  model_selection_rule: "lowest"

saving:
  save_models: true
  model_folder: "models"
  save_results: true
  results_file: "outputs/tables/model_performance.csv"
  best_model_file: "models/best_model.joblib"

prediction:
  output_folder: "data/processed/predictions"
  output_pattern: "Downscaled_Precipitation_{year}_{month:02d}.tif"
  output_format: "GeoTIFF"
  nodata_value: -9999.0
  output_dtype: "float32"
  prevent_negative_prediction: true

explainability:
  shap_enabled: true
  sample_size: 1000
  save_summary_plot: true
  output_folder: "outputs/figures"
