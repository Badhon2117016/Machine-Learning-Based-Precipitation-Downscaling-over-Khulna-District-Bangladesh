# ==========================================================
# Main Project Configuration
# Machine Learning Based Precipitation Downscaling
# Khulna District, Bangladesh
# ==========================================================

project:
  name: "Machine Learning Based Precipitation Downscaling over Khulna District"
  version: "1.0.0"
  description: >
    Geospatial and machine-learning workflow for precipitation downscaling
    over Khulna District, Bangladesh.
  random_seed: 42

paths:
  data_root: "data"
  raw_data: "data/raw"
  interim_data: "data/interim"
  processed_data: "data/processed"

  boundary: "data/raw/boundary"
  gauge: "data/raw/gauge"
  precipitation: "data/raw/precipitation"
  predictors: "data/raw/predictors"

  aligned_rasters: "data/processed/aligned_rasters"
  predictor_stack: "data/processed/predictor_stack"
  station_samples: "data/processed/station_samples"
  model_tables: "data/processed/model_tables"
  predictions: "data/processed/predictions"

  models: "models"
  outputs: "outputs"
  figures: "outputs/figures"
  maps: "outputs/maps"
  reports: "outputs/reports"
  logs: "outputs/logs"

study_area:
  name: "Khulna District"
  country: "Bangladesh"
  boundary_file: "data/raw/boundary/Khulna.shp"
  source_crs: "EPSG:4326"
  target_crs: "EPSG:32645"

time:
  start_year: 2017
  end_year: 2022
  start_month: 1
  end_month: 12
  temporal_resolution: "monthly"
  expected_months: 72

gauge:
  file: "data/raw/gauge/bmd_monthly_rainfall_2017_2022.csv"
  temporal_resolution: "monthly"
  unit: "mm"
  validation_only: true

raster:
  output_format: "GTiff"
  target_crs: "EPSG:32645"
  nodata_value: -9999.0
  compression: "LZW"
  clip_to_boundary: true
  align_rasters: true
  overwrite_existing: false
  resampling:
    continuous: "bilinear"
    categorical: "nearest"

precipitation:
  target_variable: "rainfall_mm"
  datasets:
    CHIRPS:
      enabled: true
      folder: "data/raw/precipitation/CHIRPS"
    PERSIANN_CDR:
      enabled: true
      folder: "data/raw/precipitation/PERSIANN_CDR"
    ERA5:
      enabled: true
      folder: "data/raw/precipitation/ERA5"
    IMERG:
      enabled: true
      folder: "data/raw/precipitation/IMERG"
    PERSIANN_CCS:
      enabled: true
      folder: "data/raw/precipitation/PERSIANN_CCS"
    PDIR_NOW:
      enabled: true
      folder: "data/raw/precipitation/PDIR_NOW"
    GSMaP:
      enabled: true
      folder: "data/raw/precipitation/GSMaP"

predictors:
  DEM:
    enabled: true
    folder: "data/raw/predictors/DEM"
    temporal_type: "static"
    variable_type: "continuous"

  Slope:
    enabled: true
    folder: "data/raw/predictors/Slope"
    temporal_type: "static"
    variable_type: "continuous"

  Aspect:
    enabled: true
    folder: "data/raw/predictors/Aspect"
    temporal_type: "static"
    variable_type: "continuous"

  NDVI:
    enabled: true
    folder: "data/raw/predictors/NDVI"
    temporal_type: "monthly"
    variable_type: "continuous"

  LST_Day:
    enabled: true
    folder: "data/raw/predictors/LST_Day"
    temporal_type: "monthly"
    variable_type: "continuous"

  Distance_Sea:
    enabled: true
    folder: "data/raw/predictors/Distance_Sea"
    temporal_type: "static"
    variable_type: "continuous"

stack:
  output_folder: "data/processed/predictor_stack"
  output_pattern: "Predictor_Stack_{year}_{month:02d}.tif"
  predictor_order:
    - "DEM"
    - "Slope"
    - "Aspect"
    - "NDVI"
    - "LST_Day"
    - "Distance_Sea"
  include_precipitation_target: true
  skip_if_missing_predictor: true

training:
  output_folder: "data/processed/model_tables"
  output_file: "khulna_precipitation_training_data.csv"
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  remove_nodata: true
  remove_infinite: true
  remove_duplicates: true

quality_control:
  check_file_exists: true
  check_crs: true
  check_resolution: true
  check_dimensions: true
  check_transform: true
  check_bounds: true
  check_nodata: true
  check_valid_pixel_percentage: true
  minimum_valid_pixel_percentage: 80.0
  save_report: true

output:
  save_figures: true
  save_maps: true
  save_models: true
  save_tables: true
  raster_dtype: "float32"
  figure_dpi: 300
